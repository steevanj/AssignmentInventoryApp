<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales &amp; Inventory</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login screen -->
  <section id="login-view" class="login-view hidden">
    <form id="login-form" class="card login-card" novalidate>
      <h1>Sales &amp; Inventory</h1>
      <p class="muted">Sign in to continue</p>
      <label>Email
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <div id="login-message" class="message hidden"></div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </section>

  <!-- Main application -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <span class="brand">Sales &amp; Inventory</span>
      <nav id="main-nav">
        <a href="#/orders" data-route="orders">Orders</a>
        <a href="#/customers" data-route="customers">Customers</a>
        <a href="#/products" data-route="products">Products</a>
        <a href="#/reports" data-route="reports" data-admin-only>Reports</a>
      </nav>
      <div class="user-box">
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-button" class="btn btn-small">Log out</button>
      </div>
    </header>

    <div id="global-message" class="message hidden"></div>
    <main id="page"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
